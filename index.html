<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кликер - GUGU</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5em;
        }

        .score {
            font-size: 3em;
            color: #667eea;
            margin: 20px 0;
            font-weight: bold;
        }

        .score-label {
            font-size: 1.2em;
            color: #666;
            margin-bottom: 30px;
        }

        .click-button {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 4em;
            cursor: pointer;
            transition: all 0.1s;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            margin: 0 auto 30px;
            display: block;
        }

        .click-button:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6);
        }

        .click-button:active {
            transform: scale(0.95);
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 30px 0;
        }

        .stat-box {
            background: #f0f0f0;
            padding: 20px;
            border-radius: 10px;
        }

        .stat-label {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .stat-value {
            color: #667eea;
            font-size: 1.8em;
            font-weight: bold;
        }

        .buttons-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        .reset-button, .upgrade-button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        .reset-button {
            background: #ff6b6b;
            color: white;
        }

        .reset-button:hover {
            background: #ff5252;
            transform: translateY(-2px);
        }

        .upgrade-button {
            background: #51cf66;
            color: white;
        }

        .upgrade-button:hover {
            background: #40c057;
            transform: translateY(-2px);
        }

        .upgrade-button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            height: 20px;
            margin-top: 15px;
            color: #ff6b6b;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 GUGU Кликер</h1>
        
        <div class="score-label">Всего кликов</div>
        <div class="score" id="score">0</div>

        <button class="click-button" id="clickButton">🖱️</button>

        <div class="stats">
            <div class="stat-box">
                <div class="stat-label">Кликов в сек</div>
                <div class="stat-value" id="cps">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Множитель</div>
                <div class="stat-value" id="multiplier">1x</div>
            </div>
        </div>

        <div class="buttons-group">
            <button class="upgrade-button" id="upgradeButton">⬆️ Улучшить (100)</button>
            <button class="reset-button" id="resetButton">🔄 Сброс</button>
        </div>

        <div class="message" id="message"></div>
    </div>

    <script>
        let score = 0;
        let multiplier = 1;
        let clicksPerSecond = 0;
        let autoClicksPerSecond = 0;

        const scoreDisplay = document.getElementById('score');
        const multiplierDisplay = document.getElementById('multiplier');
        const cpsDisplay = document.getElementById('cps');
        const clickButton = document.getElementById('clickButton');
        const upgradeButton = document.getElementById('upgradeButton');
        const resetButton = document.getElementById('resetButton');
        const messageDisplay = document.getElementById('message');

        // Загрузка данных
        function loadData() {
            const saved = localStorage.getItem('guguClicker');
            if (saved) {
                const data = JSON.parse(saved);
                score = data.score || 0;
                multiplier = data.multiplier || 1;
                autoClicksPerSecond = data.autoClicks || 0;
                updateDisplay();
            }
        }

        // Сохранение данных
        function saveData() {
            localStorage.setItem('guguClicker', JSON.stringify({
                score,
                multiplier,
                autoClicks: autoClicksPerSecond
            }));
        }

        // Клик по кнопке
        clickButton.addEventListener('click', () => {
            const clickValue = multiplier;
            score += clickValue;
            updateDisplay();
            saveData();

            // Эффект при клике
            clickButton.style.transform = 'scale(0.9)';
            setTimeout(() => {
                clickButton.style.transform = 'scale(1)';
            }, 100);
        });

        // Улучшение
        upgradeButton.addEventListener('click', () => {
            const cost = 100 * multiplier;
            if (score >= cost) {
                score -= cost;
                multiplier += 1;
                updateDisplay();
                saveData();
                showMessage(`Множитель: ${multiplier}x! 🚀`);
            } else {
                showMessage(`Нужно еще ${cost - score} кликов`);
            }
        });

        // Сброс
        resetButton.addEventListener('click', () => {
            if (confirm('Вы уверены? Все данные будут удалены!')) {
                score = 0;
                multiplier = 1;
                autoClicksPerSecond = 0;
                updateDisplay();
                localStorage.removeItem('guguClicker');
                showMessage('Данные очищены! 🔄');
            }
        });

        // Обновление дисплея
        function updateDisplay() {
            scoreDisplay.textContent = Math.floor(score);
            multiplierDisplay.textContent = multiplier + 'x';
            cpsDisplay.textContent = (clicksPerSecond + autoClicksPerSecond).toFixed(1);

            const cost = 100 * multiplier;
            upgradeButton.textContent = `⬆️ Улучшить (${cost})`;
            upgradeButton.disabled = score < cost;
        }

        // Сообщение
        function showMessage(text) {
            messageDisplay.textContent = text;
            setTimeout(() => {
                messageDisplay.textContent = '';
            }, 2000);
        }

        // Автоклики каждую секунду
        setInterval(() => {
            if (autoClicksPerSecond > 0) {
                score += autoClicksPerSecond;
                updateDisplay();
                saveData();
            }
        }, 1000);

        // Инициализация
        loadData();
    </script>
</body>
</html>
